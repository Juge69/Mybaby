<body>
    <button id="themebutton">dark</button>
    <div id="challenge1"></div>
    <div id="challenge2"></div>
    <div id="challenge3"></div>


</body>
<script>
    const button = document.querySelector('#themebutton');
    const background = document.querySelector('body');
    let ecl = document.getElementById("challenge1");
    let ecl2 = document.getElementById("challenge2");
   
    const whitetheme = () => {
        background.style.backgroundColor = "white";
        background.style.color = "black";
        button.innerHTML = "dark";
    }
    const darktheme = () => {
        background.style.backgroundColor = "black";
        background.style.color = "white";
        button.innerHTML = "white";
    }

    button.addEventListener('click', () => {
        if (background.style.backgroundColor === "white") {
            darktheme();
        } else {
            whitetheme();
        }
    });
