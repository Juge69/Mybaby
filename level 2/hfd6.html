<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Opdracht 1</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            font-size: 24px;
        }

        .container {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container>div:last-child {
            text-align: end;
            flex: 0.1;
        }
    </style>
</head>

<body>
    <form>
        <div class="container">
            <div> <input type="number" name="number1" placeholder="Number 1" step="any"> </div>
            <div> 
                <select name="operator">
                    <option value="add">+</option>
                    <option value="subtract">-</option>
                    <option value="multiply">x</option>
                    <option value="divide">/</option>
                    <option value="power">**</option>
                    <option value="root">√</option>
                </select> 
            </div>
            <div> <input type="number" name="number2" placeholder="Number 2" step="any"> 
            </div>
            <div> <input type="submit" name="submit" value="=">
            </div> 
            <div id="result">#</div>
        </div>
    </form>
    <script>
        const form = document.querySelector('form');
        const result = document.querySelector('#result');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(form);
            const number1 = formData.get('number1');
            const number2 = formData.get('number2');
            const operator = formData.get('operator');
            result.innerText = doCalculate(number1, number2, operator);
        });
        function doCalculate(n1, n2, o) {
            if (o === 'add') { 
                //optellen
                return parseFloat(n1) + parseFloat(n2);
            } else if (o === 'subtract') {
                //aftrekken
                return parseFloat(n1) - parseFloat(n2);
            } else if (o === 'multiply') {
                //vermenigvuldigen
                return parseFloat(n1) * parseFloat(n2);
            } else if (o === 'divide') {
                //delen
                return parseFloat(n1) / parseFloat(n2);
            } else if (o === 'power') {
                //macht
                return Math.pow(parseFloat(n1), parseFloat(n2));
            } else if (o === 'root') {
                //wortel
                return Math.sqrt(parseFloat(n1));
            }
     }
    </script>
